name: Watch Autmog

on:
  schedule:
    - cron: "*/5 * * * *"    # GitHub's minimum; each run then re-checks every 60s
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new products
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NOTIFY_RESTOCK: "true"
          CHECK_EVERY: "60"   # seconds between checks
          RUN_FOR: "270"      # keep checking ~4.5 min, until the next run starts
        run: python monitor.py

      - name: Save what we've seen
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen products" && git push)
